<section class="app-product-item max-w-7xl mx-auto px-6 py-12">
    @if (product) {
    <div
        class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-8 p-8 items-center">

        <div class="h-96 rounded-xl overflow-hidden bg-gray-100">
            <img [src]="product.image" [alt]="product.name" class="w-full h-full object-cover">
        </div>

        <!-- Informações -->
        <div class="flex flex-col justify-between h-full">
            <div>
                <h3 class="text-3xl font-extrabold text-gray-900 mb-4">{{ product.name }}</h3>
                <p class="text-gray-600 leading-relaxed mb-6">{{ product.description }}</p>
                <p class="text-3xl font-extrabold text-red-600 mb-6">
                    R$ {{ product.price }}
                </p>
                <p class="text-sm text-gray-500 mb-8">
                    <strong class="text-gray-700">Estoque disponível:</strong> {{ product.stockQnt }} unidades
                </p>
            </div>

            <div class="flex items-center gap-4">
                <button
                    class="flex-1 bg-red-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-red-700 transition-colors shadow-lg shadow-red-150 text-center cursor-pointer"
                    (click)="addToCart()">
                    Colocar no carrinho
                </button>

                <a routerLink="/produtos"
                    class="bg-gray-100 text-gray-700 font-semibold py-3 px-6 rounded-xl hover:bg-gray-200 transition-colors text-center">
                    Voltar
                </a>
            </div>
        </div>

    </div>
    } @else {
    <div class="text-center py-20">
        <h3 class="text-2xl font-bold text-gray-800 mb-2">Produto não encontrado</h3>
        <p class="text-gray-500 mb-6">O item selecionado não existe ou foi removido.</p>
        <a routerLink="/produtos"
            class="inline-block bg-red-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-red-700 transition-colors">
            Voltar para os produtos
        </a>
    </div>
    }
</section>
