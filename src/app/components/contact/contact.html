<section class="contact-section flex flex-col lg:flex-row justify-center items-center min-h-full max-w-7xl mx-auto ">
    <div class="w-full lg:w-1/2 flex flex-row justify-center">
        <form action="#" class="w-full max-w-md bg-white p-8 rounded-lg shadow-md flex flex-col gap-4">
            <fieldset class="border-0 p-0 m-0 flex flex-col gap-4">
                <legend class="text-2xl font-bold mb-2 text-gray-800">Entre em contato</legend>

                <div class="flex flex-col">
                    <label for="name" class="text-sm font-medium text-gray-700 mb-1">Nome</label>
                    <input type="text" id="name" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>

                <div class="flex flex-col">
                    <label for="email" class="text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="email" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>

                <div class="flex flex-col">
                    <label for="message" class="text-sm font-medium text-gray-700 mb-1">Mensagem</label>
                    <textarea name="message" id="message" rows="4" required placeholder="Digite sua mensagem aqui..."
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-600"></textarea>
                </div>

                <button type="submit"
                    class="mt-2 bg-red-600 text-white py-2 px-4 rounded-md hover:bg-red-700 transition-colors font-medium">Enviar
                    Mensagem</button>
            </fieldset>
        </form>
    </div>

    <div class="w-full lg:w-1/2 flex">
        <img src="/assets/images/contact/contact.jpg" class="max-w-sm rounded-lg shadow-lg object-cover">
    </div>
</section>
